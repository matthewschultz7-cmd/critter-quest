<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Critter Quest — Free Math &amp; Reading Practice for Kids (K–3rd Grade)</title>
  <meta name="description" content="Critter Quest is a free, no-signup math and reading practice app for kindergarten and 3rd grade students. Kids earn coins and collectible critter cards by answering questions correctly. Fun for home or classroom use." />

  <!-- Open Graph (Facebook, Pinterest, iMessage previews) -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://critterquest.org/" />
  <meta property="og:title" content="Critter Quest — Free Math &amp; Reading Practice for Kids" />
  <meta property="og:description" content="Free math and reading drills for K–3rd grade. Kids earn coins and collectible critter cards as they practice. No account required." />
  <meta property="og:image" content="https://critterquest.org/og-image.png" />

  <!-- Twitter / X Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Critter Quest — Free Math &amp; Reading Practice for Kids" />
  <meta name="twitter:description" content="Free math and reading drills for K–3rd grade. Kids earn coins and collectible critter cards as they practice. No account required." />
  <meta name="twitter:image" content="https://critterquest.org/og-image.png" />

  <!-- Search / indexing hints -->
  <meta name="robots" content="index, follow" />
  <meta name="keywords" content="free math games for kids, kindergarten math practice, 3rd grade math drills, reading practice for kids, elementary math app, math facts practice, free educational games" />
  <link rel="canonical" href="https://critterquest.org/" />

  <!-- Structured data: EducationalApplication -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Critter Quest",
    "url": "https://critterquest.org",
    "description": "Free math and reading practice app for kindergarten and 3rd grade students. Kids earn coins and collectible critter cards by answering questions correctly.",
    "applicationCategory": "EducationalApplication",
    "operatingSystem": "Any",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    },
    "audience": {
      "@type": "EducationalAudience",
      "educationalRole": "student",
      "suggestedMinAge": "5",
      "suggestedMaxAge": "10"
    },
    "educationalLevel": "Kindergarten, Grade 1, Grade 2, Grade 3",
    "teaches": ["Addition", "Subtraction", "Multiplication", "Division", "Reading", "Sight Words", "Spelling"],
    "inLanguage": "en",
    "isAccessibleForFree": true
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="join-styles.css" />
</head>
<body>

  <!-- Confetti (JS fills this) -->
  <div id="confetti-box"></div>

  <!-- ── App Header (hidden on profile/join screens) ── -->
  <header class="app-header" id="app-header" style="display:none">
    <div class="header-left">
      <button class="hdr-name-btn" id="hdr-name" title="Change theme">🐾 —</button>
    </div>
    <div class="header-center">
      <button class="hdr-nav-btn" id="hdr-dashboard">🏠 Home</button>
    </div>
    <div class="header-right">
      <button class="hdr-coins-btn" id="hdr-coins">🪙 0</button>
      <div class="flair-slots" id="hdr-flair">
        <button class="flair-slot" data-slot="0">+</button>
        <button class="flair-slot" data-slot="1">+</button>
        <button class="flair-slot" data-slot="2">+</button>
      </div>
      <button class="hdr-feedback-btn" id="hdr-feedback" title="Share feedback">💬</button>
    </div>
    <button class="hdr-parent-btn" id="hdr-parent" title="Parent Hub">🔑 Parent</button>
  </header>

  <!-- ── Screens ── -->
  <div id="screen-join"         class="screen active"></div>  <!-- NEW: join/create family -->
  <div id="screen-profiles"     class="screen"></div>
  <div id="screen-profile-form" class="screen"></div>
  <div id="screen-dashboard"    class="screen"></div>
  <div id="screen-quest-select" class="screen"></div>
  <div id="screen-quest-game"   class="screen"></div>
  <div id="screen-read-game"    class="screen"></div>
  <div id="screen-quest-done"   class="screen"></div>
  <div id="screen-inventory"    class="screen"></div>
  <div id="screen-bank"         class="screen"></div>
  <div id="screen-store"        class="screen"></div>
  <div id="screen-store-admin"  class="screen"></div>
  <div id="screen-parent-hub"   class="screen"></div>
  <div id="screen-themes"       class="screen"></div>
  <div id="screen-journey"      class="screen"></div>
  <div id="screen-story-select" class="screen"></div>
  <div id="screen-story-game"   class="screen"></div>
  <div id="screen-story-done"   class="screen"></div>
  <div id="screen-friends"      class="screen"></div>

  <!-- ── Footer ── -->
  <footer class="app-footer">
    <a href="mailto:contact@critterquest.org">contact@critterquest.org</a>
  </footer>

  <!-- ── Modal overlay ── -->
  <div id="modal-overlay" class="modal-overlay" style="display:none">
    <div class="modal-box" id="modal-box"></div>
  </div>

  <!-- ── Firebase SDKs (v9 compat build) ── -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-analytics-compat.js"></script>

  <!-- ── App scripts ── -->
  <!-- data.js must load before firebase-init.js -->
  <script src="data.js"></script>
  <script src="firebase-init.js"></script>
  <script src="app.js"></script>
  <script src="story-quests-data.js"></script>
  <script src="story-quests.js"></script>

</body>
</html>
